<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xkeen-ui</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ee;--mut:#8b93a5;--acc:#4f9cff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#0c0e12;color:var(--fg);padding:10px 12px}
input{width:100%;margin:6px 0 12px}
button{background:var(--acc);border-color:var(--acc);color:#04101f;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.err{color:var(--bad);min-height:1.4em}
.mut{color:var(--mut)}
#login{max-width:340px;margin:12vh auto}
[hidden]{display:none!important}
h3{margin:0 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid .card{margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.row input{margin:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin-left:6px}
.dot.on{background:#3ecf8e}.dot.off{background:var(--bad)}
pre{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:360px;white-space:pre-wrap;word-break:break-all;font-size:13px}
select{font:inherit;border-radius:8px;border:1px solid var(--line);background:#0c0e12;color:var(--fg);padding:10px 12px}
button:disabled{opacity:.5;cursor:wait}
.ok{color:#3ecf8e}.warn{color:var(--bad)}
ul{margin:8px 0;padding-left:20px}
</style>
</head>
<body>
<section id="login" class="card" hidden>
  <h2>xkeen-ui</h2>
  <label>User<input id="user" autocomplete="username" value="admin"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="err" id="err"></div>
  <button id="go">Sign in</button>
</section>
<div id="app" hidden>
  <header><strong>xkeen-ui</strong><button class="ghost" id="out">Sign out</button></header>
  <main>
    <div class="grid">
      <div class="card"><h3>XKeen <span id="dot" class="dot"></span></h3>
        <div id="st" class="mut">…</div><div id="ver2" class="mut"></div>
        <div class="row">
          <button data-act="start">Start</button><button data-act="stop" class="ghost">Stop</button>
          <button data-act="restart" class="ghost">Restart</button><button data-act="test" class="ghost">Test config</button>
        </div></div>
      <div class="card"><h3>Subscription</h3>
        <div id="sub" class="mut">…</div>
        <div class="row"><button data-act="sub">Update now</button></div></div>
    </div>
    <div class="card"><h3>Main node</h3>
      <div>Active: <strong id="eff">…</strong></div>
      <input id="main" placeholder="Remark substring, fallbacks separated by |" spellcheck="false">
      <div id="parts" class="mut"></div>
      <div class="row"><button id="setmain">Apply</button></div>
      <details><summary class="mut">Nodes in subscription</summary><ul id="nodes" class="mut"></ul></details></div>
    <div class="card"><h3>Config files (read-only)</h3>
      <div class="row"><select id="file"></select>
      <label class="mut"><input type="checkbox" id="reveal" style="width:auto;margin:0 6px"> reveal secrets</label>
      <button class="ghost" id="view">View</button></div>
      <pre id="fileout" hidden></pre></div>
    <div class="card" id="jobcard" hidden><h3 id="jobname"></h3><pre id="jobout"></pre></div>
  </main>
</div>
<footer class="mut" style="text-align:center;padding:12px">xkeen-ui <span id="ver"></span></footer>
<script src="/app.js"></script>
</body>
</html>
