<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xkeen-ui</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ee;--mut:#8b93a5;--acc:#4f9cff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#0c0e12;color:var(--fg);padding:10px 12px}
input{width:100%;margin:6px 0 12px}
button{background:var(--acc);border-color:var(--acc);color:#04101f;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.err{color:var(--bad);min-height:1.4em}
.mut{color:var(--mut)}
#login{max-width:340px;margin:12vh auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<section id="login" class="card" hidden>
  <h2>xkeen-ui</h2>
  <label>User<input id="user" autocomplete="username" value="admin"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="err" id="err"></div>
  <button id="go">Sign in</button>
</section>
<div id="app" hidden>
  <header><strong>xkeen-ui</strong><button class="ghost" id="out">Sign out</button></header>
  <main><div class="card">Signed in. Features arrive in the next stages.</div></main>
</div>
<footer class="mut" style="text-align:center;padding:12px">xkeen-ui <span id="ver"></span></footer>
<script src="/app.js"></script>
</body>
</html>
